// sets the .proto file syntax version
syntax = "proto3";

// sets the output golang package name
option go_package = "github.com/borderzero/border0-proto/connector";

// sets the protobuf package name (i.e. definitions namespace)
package border0.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "common/messages.proto";

service ConnectorService {
  rpc ControlStream(stream ControlStreamRequest) returns (stream ControlStreamResponse);
}

message ControlStreamRequest {
  oneof RequestType {
    Config config = 1;
    border0.common.v1.HeartbeatMessage heartbeat = 2;
    PluginDiscoveryResults plugin_discovery_results = 3;
    TunnelCertificateSignRequest tunnel_certificate_sign_request = 5;
    Log log = 6;
    ConnectorMetadata metadata = 7;
    AuthorizeRequest authorize = 8;
    SessionUpdateRequest session_update = 9;
    SshCertificateSignRequest ssh_certificate_sign_request = 10;
    UploadRecording upload_recording = 11;
    CertificateSignRequest Certificate_sign_request = 12;
    SessionEvent session_event = 13;
    border0.common.v1.DiscoveryDetailsMessage discovery_details = 14;
    AuthorizePeerRequest authorize_peer = 15;
    SessionRequest session = 16;
    border0.common.v1.StatsMessage stats = 17;
    Logs logs = 18;
    MintRecordingUploadRequest mint_recording_upload = 19;
    FinalizeRecordingUploadRequest finalize_recording_upload = 20;
  }
}

message ControlStreamResponse {
  oneof RequestType {
    Init init = 1;
    ConnectorConfig connector_config = 2;
    UpdateConfig update_config = 3;
    border0.common.v1.HeartbeatMessage heartbeat = 4;
    TunnelCertificateSignResponse tunnel_certificate_sign_response = 5;
    Discover discover = 6;
    Stop stop = 7;
    Disconnect disconnect = 8;
    AuthorizeResponse authorize = 9;
    SshCertificateSignResponse ssh_certificate_sign_response = 10;
    CertificateSignResponse Certificate_sign_response = 11;
    border0.common.v1.NetworkStateMessage network_state = 12;
    border0.common.v1.PeerOnlineMessage peer_online = 13;
    border0.common.v1.PeerOfflineMessage peer_offline = 14;
    SessionResponse session = 16;
    AllowedNetworks allowed_networks = 17;
    MintRecordingUploadResponse mint_recording_upload = 18;
    FinalizeRecordingUploadResponse finalize_recording_upload = 19;
  }
}

message Organization {
  string id = 1;
  string name = 2;
  string subdomain = 3;
  google.protobuf.Struct certificates = 4;
}

message TunnelCertificateSignRequest {
  string request_id = 1;
  string socket_id = 2;
  string public_key = 3;
  bool is_v2 = 4;
}

message TunnelCertificateSignResponse {
  string request_id = 1;
  string certificate = 2;
  string hostkey = 3;
}

message Init {
  ConnectorConfig connector_config = 1;
  repeated SocketConfig sockets = 2;
  repeated PluginConfig plugins = 3;

  // used only for connectors in "device mode"
  string device_id = 4;
  string network_cidr_v4 = 5;
  string network_cidr_v6 = 6;
  string self_ipv4 = 7;
  string self_ipv6 = 8;
  string network_resources_cidr_v4 = 9;
  string network_resources_cidr_v6 = 10;
}

message UpdateConfig {
  Action action = 1;
  oneof ConfigType {
    PluginConfig plugin_config = 2;
    SocketConfig socket_config = 3;
  }
}

message Log {
  string connector_id = 1;
  string socket_id = 2;
  string plugin_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  string severity = 5;
  string message = 6;
}

message Logs {
  repeated Log logs = 1;
}

message ConnectorMetadata {
  google.protobuf.Struct data = 1;
}

enum Action {
    CREATE = 0;
    UPDATE = 1;
    DELETE = 2;
    OTHER = 3;
}

message Config {
  bool connector = 1;
  bool sockets = 2;
  bool plugins = 3;
}

message PluginDiscoveryResults {
  string plugin_id = 1;
  string request_id = 2;
  PluginDiscoveryResultsMetadata metadata = 3;
  repeated google.protobuf.Struct resources = 4;
  repeated string errors = 5;
  repeated string warnings = 6;
}

message PluginDiscoveryResultsMetadata {
  string discovery_id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp ended_at = 3;
}

message Tag {
  string key = 1;
  string value = 2;
}

message SocketConfig {
  string id = 1;
  string name = 2;
  string type = 3;
  google.protobuf.Struct config = 4;
}

// RecordingUploadStrategy tells the connector how to upload session recordings.
// The zero value is CONTROL_PLANE so that older connectors (which ignore the
// field) and older control planes (which never set it) both default to the
// existing bytes-over-stream behavior.
enum RecordingUploadStrategy {
  // control_plane: stream recording bytes to the control plane over the control
  // stream (the legacy/default behavior).
  RECORDING_UPLOAD_STRATEGY_CONTROL_PLANE = 0;
  // s3: upload recording bytes directly to S3 using presigned URLs minted by the
  // control plane (bytes bypass the control plane).
  RECORDING_UPLOAD_STRATEGY_S3 = 1;
}

// RecordingUploadConfig tells the connector how to upload session recordings. It
// is a message (rather than a bare enum) so upload tuning knobs the connector
// needs at startup can be added later without a proto migration. The destination
// (bucket/key/path) is NOT here: it is delivered per-recording, baked into the
// presigned request returned by MintRecordingUpload. A nil/zero-value config
// means control-plane (legacy), keeping old connectors/control planes compatible.
message RecordingUploadConfig {
  RecordingUploadStrategy strategy = 1;
  // future: int64 multipart_part_size = 2; int64 max_recording_bytes = 3; ...
}

message ConnectorConfig {
 string name = 1;
 int32 heartbeat_interval = 2;
 Organization organization = 3;
 bool private_network_enabled = 4;
 // recording_upload tells the connector how to upload session recordings.
 // Unset => control-plane (legacy). The control plane selects this per connector.
 RecordingUploadConfig recording_upload = 5;
}

message PluginConfig {
  string id =1;
  string name = 2;
  string type = 3;
  google.protobuf.Struct config = 4;
}

message Discover {
  string id = 1;
  string request_id = 2;
}

message Stop {
  string reason = 1;
}

message Disconnect {
  string reason = 1;
}

message AuthorizeRequest {
  string request_id = 1;
  string protocol = 2;
  string user_email = 3;
  string ip_address = 4;
  string session_key = 5;
  string socket_id = 6;
}


message AuthorizePeerRequest {
  string request_id = 1;
  string protocol = 2;
  string public_key = 3;
  string ip_address = 4;
  string socket_id = 5;
  string user_email = 6; // optional, used instead of public_key for email-based authz if provided
}

message actionList {
  repeated string values = 1;
}

message Permissions {
  repeated google.protobuf.Struct permissions = 1;
}

message infoList {
  repeated string values = 1;
}

message AuthorizeResponse {
  string request_id = 1;
  map<string, actionList> allowed_actions = 2;
  map<string, infoList> info = 3;
  map<string, Permissions> permissions = 5;
  string email = 6;
  string entity_uuid = 7;
  repeated border0.common.v1.Group groups = 8;
}

message SessionUpdateRequest {
  string session_key = 1;
  string socket_id = 2;
  string user_data = 3;
  string result = 4;
  string auth_info_failed = 5;
}

message SessionRequest {
  string request_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  google.protobuf.Timestamp last_seen = 4;
  string email = 5;
  string log_type = 6;
  string socket_id = 7;
  string server_name = 8;
  string server_port = 9;
  string client_ip = 10;
  string client_port = 11;
  string session_data = 12;
  string session_key = 13;
  string result = 14;
  string auth_info = 15;
  bytes metadata = 16;
  string entity_uuid = 17;
}

message SessionResponse {
  string request_id = 1;
  string session_id = 2;
  bytes ssh_ticket = 3;
}

message SessionEvent {
  string session_key = 1;
  string socket_id = 2;
  string type = 3;
  string status = 4;
  string metadata = 5;
}

message SshCertificateSignRequest {
  string request_id = 1;
  string socket_id = 2;
  string session_key = 3;
  string user_email = 4;
  bytes public_key = 5;
  bytes ticket = 6;
}

message SshCertificateSignResponse {
  string request_id = 1;
  bytes certificate = 2;
}

message UploadRecording {
  string session_key = 1;    // session identifier (unique globally)
  string recording_id = 2;   // recording identifier (unique per-session)
  bytes recording = 3;       // actual recording bytes
  string recording_type = 4; // type of the recording e.g. asciinema, log, etc...
}

// RecordingUploadMode selects how a recording's bytes are uploaded directly to
// the storage provider (bypassing the control plane's byte path).
enum RecordingUploadMode {
  RECORDING_UPLOAD_MODE_UNSPECIFIED = 0;
  // single: one presigned request for a recording that fits in a single object.
  RECORDING_UPLOAD_MODE_SINGLE = 1;
  // multipart: a presigned request per part, assembled by the provider into one object.
  RECORDING_UPLOAD_MODE_MULTIPART = 2;
}

// RecordingUploadOutcome is how a recording upload was finalized.
enum RecordingUploadOutcome {
  RECORDING_UPLOAD_OUTCOME_UNSPECIFIED = 0;
  // completed: all bytes are in storage; finalize/assemble the object.
  RECORDING_UPLOAD_OUTCOME_COMPLETED = 1;
  // aborted: the recording ended without completing; discard any partial upload
  // so orphaned parts are not retained/billed.
  RECORDING_UPLOAD_OUTCOME_ABORTED = 2;
}

// PresignedHTTPRequest is a provider-agnostic, ready-to-execute HTTP request the
// connector performs to upload bytes directly to storage. The connector fills the
// request body with the recording bytes and sends it as-is; it does not need to
// know which provider minted it.
message PresignedHTTPRequest {
  string method = 1;                  // e.g. "POST" (single) or "PUT" (multipart part)
  string url = 2;                     // fully-qualified, presigned URL
  map<string, string> headers = 3;    // headers that must be sent verbatim
  // form_fields are multipart/form-data fields that must precede the file field
  // (used by providers whose single-object upload is an HTTP POST form, e.g. S3
  // presigned POST). Empty for simple PUT-style uploads.
  map<string, string> form_fields = 4;
}

// MintRecordingUploadRequest asks the control plane to mint a short-lived, direct
// storage upload target for a recording (or the next multipart part). It also
// serves as the per-recording liveness/kill gate and, on the first call, causes
// the control plane to create the (in-progress) recording metadata row.
message MintRecordingUploadRequest {
  string request_id = 1;     // correlation id for the response
  string session_key = 2;    // session identifier (unique globally)
  string recording_id = 3;   // recording identifier (unique per-session)
  string recording_type = 4; // type of the recording e.g. asciinema, log, etc...
  RecordingUploadMode mode = 5;
  // upload_session_id is empty on the first mint; for multipart it is the opaque
  // token returned by the first mint, echoed back so the control plane can presign
  // against the same provider-side upload (e.g. an S3 multipart UploadId).
  string upload_session_id = 6;
  // part_number is 1-based; only meaningful for multipart mode.
  int32 part_number = 7;
}

// MintRecordingUploadResponse carries the minted, provider-agnostic upload target.
// If the control plane refuses direct uploads for this recording (e.g. killed
// session), error is set and the connector falls back to the legacy path.
message MintRecordingUploadResponse {
  string request_id = 1;
  RecordingUploadMode mode = 2;
  string error = 3; // non-empty if minting was refused (e.g. killed session)

  // the request the connector must execute to upload the bytes
  PresignedHTTPRequest request = 4;

  // opaque upload session token to carry forward on subsequent multipart mints
  // and on finalize (e.g. an S3 multipart UploadId). Empty for single mode.
  string upload_session_id = 5;
  int32 part_number = 6; // echoed back for multipart

  // effective expiry of the minted request (min of requested and signing-cred TTL)
  google.protobuf.Timestamp expires_at = 7;
  int64 max_content_length = 8; // hard size cap enforced by the presign
}

// UploadedPart identifies one uploaded multipart part and the opaque handle the
// provider returned for it (e.g. an S3 ETag) so the control plane can assemble
// the parts on finalize.
message UploadedPart {
  int32 part_number = 1;
  string part_id = 2; // opaque provider handle, e.g. S3 ETag
}

// FinalizeRecordingUploadRequest finalizes a recording after its bytes are in
// storage, either completing (assembling) it or aborting a partial upload. It
// carries the sizes the connector observed so the control plane can emit telemetry
// and enqueue downstream analysis without ever seeing the bytes.
message FinalizeRecordingUploadRequest {
  string request_id = 1;
  string session_key = 2;
  string recording_id = 3;
  string recording_type = 4;
  RecordingUploadMode mode = 5;
  RecordingUploadOutcome outcome = 6;
  string upload_session_id = 7;      // multipart only (opaque)
  repeated UploadedPart parts = 8;   // multipart + completed only
  int64 compressed_size = 9;         // total bytes uploaded
  int64 uncompressed_size = 10;      // total decompressed bytes
}

message FinalizeRecordingUploadResponse {
  string request_id = 1;
  bool ok = 2;
  string error = 3;
}

message CertificateSignRequest {
  string request_id = 1;
  bytes certificate_signing_request = 2;
}

message CertificateSignResponse {
  string request_id = 1;
  bytes certificate = 2;
}

message AllowedNetworks {
  map<string, AllowedNetworksSocketConfig> devices = 1;
}

message AllowedNetworksSocketConfig {
  map<string, AllowedNetworksSubnets> sockets = 1;
  map<string, AllowedNetworksDnsPatterns> dns_patterns = 2; // socketID -> DNS patterns for DNS-based routing
  string ipv4_address = 3; // The device's IPv4 address (may be empty)
  string ipv6_address = 4; // The device's IPv6 address (may be empty)
}

message AllowedNetworksSubnets {
  repeated string subnets = 1;
}

// DNS patterns for a socket. Supports exact domains ("api.example.com") and wildcards ("*.example.com").
// Connectors use these patterns to resolve DNS queries and manage firewall rules automatically.
message AllowedNetworksDnsPatterns {
  repeated string patterns = 1; // List of DNS patterns (e.g., "*.example.com", "api.company.io")
}

